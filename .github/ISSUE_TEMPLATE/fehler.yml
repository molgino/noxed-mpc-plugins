name: Bug report / Fehler melden
description: Something does not work on the MPC or when building.
labels: [bug]
body:
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      options: [Acidline, Prism Wave, MPC Overwitch, MPC Overwitch Send, MPC USB Bridge, Tools / build]
    validations: {required: true}
  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: e.g. 0.5.0
    validations: {required: true}
  - type: input
    id: mpc
    attributes:
      label: MPC model and MPC OS version
      placeholder: e.g. MPC Live III, MPC OS 3.10.1
    validations: {required: true}
  - type: input
    id: device
    attributes:
      label: Connected device (Overwitch / USB Bridge)
      placeholder: e.g. Digitone II (OS 1.10), Roland S-1
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Steps to reproduce, a photo of the status rows or the report file from the plugin folder help a lot.
    validations: {required: true}
