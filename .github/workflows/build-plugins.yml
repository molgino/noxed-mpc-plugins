name: Build MPC plugins

# Builds all NOXED plugins for the MPC (native + ARM32 + ARM64), runs the SDK
# validator and host_sim test, and uploads the ready-to-copy plugin folders.
on:
  push:
    tags: ['v*']          # a version tag (or Run workflow with a release version) publishes a GitHub release
    branches: ['**']
    paths:
      - 'plugins/**'
      - 'framework/**'
      - 'tools/**'
      - '.github/workflows/build-plugins.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Release-Version ohne v (z. B. 0.2.0); leer = nur bauen'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: ['Prism Wave', 'Acidline', 'MPC Overwitch', 'MPC Overwitch Send', 'MPC USB Bridge']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Zig cross compiler
        run: |
          python -m pip install ziglang
          echo "ZIG=$(which python)" >> "$GITHUB_ENV"

      - name: Build (native + arm32 + arm64, validated)
        run: python tools/build.py "plugins/${{ matrix.plugin }}"

      - name: MPC Overwitch desktop tests (stream simulation, engine, two libraries)
        if: matrix.plugin == 'MPC Overwitch'
        working-directory: plugins/MPC Overwitch
        run: sh tests/run_tests.sh

      - name: MPC USB Bridge desktop test (ALSA capture engine)
        if: matrix.plugin == 'MPC USB Bridge'
        working-directory: plugins/MPC USB Bridge
        run: |
          sudo apt-get install -y libasound2 >/dev/null 2>&1 || true
          ls /usr/lib/x86_64-linux-gnu/libasound.so.2* || sudo apt-get install -y libasound2t64
          sh tests/run_tests.sh

      - name: Acidline sequencer regression
        if: matrix.plugin == 'Acidline'
        run: |
          g++ -std=c++17 -O2 -Iframework tests/acidline_sequencer.cpp -o /tmp/acidline-sequencer-test
          /tmp/acidline-sequencer-test

      - name: Prism picker regression
        if: matrix.plugin == 'Prism Wave'
        run: |
          g++ -std=c++17 -O2 -Iframework tests/prism_picker.cpp -o /tmp/prism-picker-test
          /tmp/prism-picker-test

      - name: Host simulator test
        run: |
          slug=$(python -c "import json,sys; p=json.load(open('plugins/${{ matrix.plugin }}/plugin.json')); print(p['file64'].split('/')[-1].replace('-arm64.so',''))")
          .sdk-tools/host_sim "plugins/${{ matrix.plugin }}/build/native/$slug.so" test \
            --wav "plugins/${{ matrix.plugin }}/build/test.wav" | tee "plugins/${{ matrix.plugin }}/build/host-test.txt"
          grep -q "Result: PASS" "plugins/${{ matrix.plugin }}/build/host-test.txt"

      - name: Collect plugin folder
        run: |
          mkdir -p out/"VST2 Plugins"
          cp -r "plugins/${{ matrix.plugin }}/build/NOXED - VST - ${{ matrix.plugin }}" out/"VST2 Plugins"/
          cp "plugins/${{ matrix.plugin }}/build/host-test.txt" out/
          ls -R out | head -50

      - uses: actions/upload-artifact@v4
        with:
          name: NOXED - VST - ${{ matrix.plugin }}
          path: out/

      # Open MPC plugin catalog (https://open-mpc.github.io): per-build zips in the catalog's format, made with
      # their tools at a pinned commit and checked with catalog_check.py. Only for plugins listed there.
      - name: Open MPC catalog zips
        if: contains(fromJSON('["MPC Overwitch", "MPC Overwitch Send", "Prism Wave"]'), matrix.plugin)
        env:
          OPENMPC_COMMIT: 33d99c6a17f6b804cd5f710e6978243d6f3d827f
        run: |
          git clone -q https://github.com/open-mpc/mpc-vst-plugins /tmp/openmpc
          git -C /tmp/openmpc checkout -q "$OPENMPC_COMMIT"
          P="plugins/${{ matrix.plugin }}"
          case "${{ matrix.plugin }}" in
            "MPC Overwitch") CAT_ID=noxed-mpc-overwitch; CAT_LICENSE=GPL-3.0-or-later; CAT_REQUIRES="Elektron Overbridge device; USB mode Overbridge; MPC OS 3.10.1+" ;;
            "MPC Overwitch Send") CAT_ID=noxed-mpc-overwitch-send; CAT_LICENSE=GPL-3.0-or-later; CAT_REQUIRES="Elektron Overbridge device; USB mode Overbridge; MPC OS 3.10.1+" ;;
            "Prism Wave") CAT_ID=noxed-prism-wave; CAT_LICENSE=MIT; CAT_REQUIRES="MPC OS 3.10.1+" ;;
          esac
          ver=$(python -c "import json;print(json.load(open('$P/plugin.json'))['version'])")
          python /tmp/openmpc/tools/sdk_release.py "$P/build/NOXED - VST - ${{ matrix.plugin }}" --version "$ver" \
            --id "$CAT_ID" --repo molgino/noxed-mpc-plugins --license "$CAT_LICENSE" -o catalog-dist \
            --asset-name "$CAT_ID" \
            --requires "$CAT_REQUIRES"
          ls -l catalog-dist
          python /tmp/openmpc/tools/sdk_zip.py "catalog-dist/$CAT_ID-$ver-mpc-sdk.zip" catalog-dist/*-mpc-armv7.zip catalog-dist/*-mpc-aarch64.zip || echo "::warning::sdk_zip failed"
          for z in catalog-dist/*-mpc-armv7.zip catalog-dist/*-mpc-aarch64.zip; do
            if python /tmp/openmpc/tools/catalog_check.py "$z" --catalog --expect-id "$CAT_ID" --expect-repo molgino/noxed-mpc-plugins > check.txt 2>&1; then
              echo "::notice title=catalog_check OK $(basename "$z")::$(tr '\n' ' ' < check.txt | cut -c1-900)"
            else
              echo "::error title=catalog_check FAILED $(basename "$z")::$(tr '\n' ' ' < check.txt | cut -c1-900)"; exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        if: contains(fromJSON('["MPC Overwitch", "MPC Overwitch Send", "Prism Wave"]'), matrix.plugin)
        with:
          name: catalog-${{ matrix.plugin }}
          path: catalog-dist/*.zip

      - name: Package zip for release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
        run: python tools/package.py "plugins/${{ matrix.plugin }}" --out release

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
        with:
          name: zip-${{ matrix.plugin }}
          path: release/*.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.release) || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Collect zips and the combined package
        run: |
          mkdir -p dist "bundle/VST2 Plugins"
          cp art/zip-*/*.zip dist/
          cp art/catalog-*/*.zip dist/ 2>/dev/null || true
          for d in art/NOXED\ -\ VST\ -\ */"VST2 Plugins"/*; do cp -r "$d" "bundle/VST2 Plugins/"; done
          cp docs/NOXED-Anleitung.txt bundle/INSTALL.txt 2>/dev/null || true
          cp NOXED-LICENSE.txt bundle/ && cp "plugins/MPC Overwitch/LICENSE" bundle/GPL-3.0.txt
          (cd bundle && zip -qr "../dist/NOXED-MPC-Plugins-${TAG#v}.zip" .)
          ls -l dist
      - name: Release notes from CHANGELOG
        run: |
          {
            echo "Open-source plugins for Akai MPC standalone. Installation: unzip, copy the plugin folder into \`VST2 Plugins\` on an MPC drive. Requires MPC OS 3.10.1+ and Preferences → Enhancements (Beta) → Enable Enhancements and External Plugin Support."
            echo
            echo "Like the project? [Ko-fi: noxend](https://ko-fi.com/noxend)"
            echo
            awk 'NR>1 && /^## /{n++} n<3 && NR>1' CHANGELOG.md
          } > notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/*.zip --target "$GITHUB_SHA" --title "NOXED MPC Plugins ${TAG#v}" --notes-file notes.md
